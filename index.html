<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b0f1a" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#eef2f7" media="(prefers-color-scheme: light)">
    <title>sac-data-grid</title>
    <!-- The grid's API page (GitHub Pages start page), in the kit style
         guide's look: kit/css/showcase.css + sac.showcase. The live demo is
         also the manual test bed (demo/demo.js). -->
    <link rel="stylesheet" href="kit/css/ui.css">
    <link rel="stylesheet" href="kit/css/showcase.css">

    <!-- The kit, cherry-picked (deferred scripts run in order). -->
    <script defer src="kit/js/lib/globals.js"></script>
    <script defer src="kit/js/i18n/de.js"></script>
    <script defer src="kit/js/lib/icons.js"></script>
    <script defer src="kit/js/lib/hotkeys.js"></script>
    <script defer src="kit/js/lib/color.js"></script>
    <script defer src="kit/js/lib/dialog.js"></script>
    <script defer src="kit/js/lib/showcase.js"></script>
    <script defer src="kit/js/components/sac-icon.js"></script>
    <script defer src="kit/js/components/sac-nav.js"></script>
    <script defer src="kit/js/components/sac-dialog.js"></script>
    <script defer src="kit/js/components/sac-menu.js"></script>
    <script defer src="kit/js/components/sac-toast.js"></script>
    <script defer src="kit/js/components/sac-tooltip.js"></script>
    <script defer src="kit/js/components/sac-spinner.js"></script>
    <script defer src="kit/js/components/sac-segmented-control.js"></script>
    <script defer src="kit/js/components/sac-theme-toggle.js"></script>
    <script defer src="kit/js/components/sac-lang-toggle.js"></script>
    <script defer src="kit/js/components/sac-color-picker.js"></script>
    <script defer src="kit/js/components/sac-color-field.js"></script>
    <script defer src="kit/js/components/sac-calendar.js"></script>
    <script defer src="kit/js/components/sac-date-field.js"></script>
    <script defer src="kit/js/components/sac-time-field.js"></script>
    <script defer src="kit/js/components/sac-number-field.js"></script>
    <script defer src="kit/js/components/sac-select.js"></script>
    <script defer src="kit/js/components/sac-chip.js"></script>
    <script defer src="kit/js/components/sac-chip-input.js"></script>

    <!-- The grid. -->
    <script defer src="js/sac-data-grid-types.js"></script>
    <script defer src="js/sac-data-grid.js"></script>
    <script defer src="js/sac-data-grid-edit.js"></script>
    <script defer src="js/sac-data-grid-form.js"></script>
    <script defer src="js/sac-data-grid-source.js"></script>
    <script defer src="js/sac-data-grid.de.js"></script>

    <script defer src="demo/demo.js"></script>
    <script defer src="demo/api.js"></script>
    <style>
        .demo-bar { flex-wrap: wrap; gap: 10px 14px; margin-bottom: 12px; }
        .demo-bar .select { width: auto; }
        .demo-bar select { width: auto; padding-block: 5px; font-size: 0.75rem; }
        #grid { height: 520px; --grid-bg: var(--panel); }
        .demo-hint { margin: 8px 0 0; font-size: 0.75rem; color: var(--text-muted); }
    </style>
</head>
<body class="app-page">
    <sac-nav brand="sac-data-grid" brand-icon="grid" app-name="v1.0.0"
             brand-href="https://sacrvm.github.io/sacrvm-appkit/#/styleguide/addons">
        <div slot="context">
            <sac-lang-toggle></sac-lang-toggle>
            <sac-theme-toggle></sac-theme-toggle>
        </div>
    </sac-nav>

    <div class="main-layout">
        <div class="app-scroll">
            <div class="sg-page" id="page">
                <h1>&lt;sac-data-grid&gt;</h1>
                <p class="lead">A spreadsheet-grade, editable data table for SACRVM APPKIT apps: virtual rows
                   into the hundred thousands, sort and filter, inline editing with the kit's cell editors,
                   a record form, and a data-source contract for server paging.
                   Needs SACRVM APPKIT 2.22.0 or newer.</p>

                <!-- The live demo: a 100k-row array source and a paged "server" with
                     latency (?fail=N fails every Nth load); the switches set the grid's
                     options. -->
                <div class="sg-demo">
                    <div class="demo-bar toolbar">
                        <sac-segmented-control id="source" value="array">
                            <button data-value="array" data-key="demo.source-array">100k rows</button>
                            <button data-value="server" data-key="demo.source-server">Server</button>
                        </sac-segmented-control>
                        <sac-segmented-control id="mode" value="sheet">
                            <button data-value="read" data-key="demo.mode-read">Read</button>
                            <button data-value="sheet" data-key="demo.mode-sheet">Sheet</button>
                            <button data-value="form" data-key="demo.mode-form">Form</button>
                        </sac-segmented-control>
                        <sac-segmented-control id="save-mode" value="row">
                            <button data-value="cell" data-key="demo.save-cell">Save per cell</button>
                            <button data-value="row" data-key="demo.save-row">per row</button>
                            <button data-value="batch" data-key="demo.save-batch">in batches</button>
                        </sac-segmented-control>
                        <sac-segmented-control id="paging" value="scroll">
                            <button data-value="scroll" data-key="demo.paging-scroll">Scroll</button>
                            <button data-value="pages" data-key="demo.paging-pages">Pages</button>
                        </sac-segmented-control>
                        <sac-segmented-control id="lines" value="quiet">
                            <button data-value="quiet" data-key="demo.lines-quiet">Quiet</button>
                            <button data-value="grid" data-key="demo.lines-grid">Grid lines</button>
                        </sac-segmented-control>
                        <sac-segmented-control id="row-header" value="marks">
                            <button data-value="marks" data-key="demo.rh-marks">Marks</button>
                            <button data-value="numbers" data-key="demo.rh-numbers">Row numbers</button>
                            <button data-value="none" data-key="demo.rh-none">No row header</button>
                        </sac-segmented-control>
                        <span class="select">
                            <select id="regional" aria-label="Regional format" data-key-label="demo.regional">
                                <option value="iso">2026-09-28 · 1,234.5 · 24h</option>
                                <option value="us">09/28/2026 · 1,234.5 · 12h</option>
                                <option value="de">28.09.2026 · 1.234,5 · 24h</option>
                                <option value="ch">28.09.2026 · 1'234.5 · 24h</option>
                            </select>
                        </span>
                    </div>
                    <sac-data-grid id="grid" label="Orders"></sac-data-grid>
                    <p class="demo-hint" id="hint"></p>
                </div>

                <div id="api"></div>
            </div>
        </div>
    </div>
</body>
</html>
